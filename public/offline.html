<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181718">
    <title>You’re offline · Fieldnotes</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        display: grid;
        place-items: center;
        background: #f7f5f3;
        color: #1b191a;
        font-family: Georgia, serif;
      }
      main { width: min(100%, 520px); }
      a { color: inherit; text-decoration: none; }
      .brand { font-size: 24px; letter-spacing: -1px; }
      .brand span { color: #a83245; font-style: italic; }
      .label {
        margin: 72px 0 16px;
        color: #71696a;
        font: 11px/1.5 monospace;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(44px, 9vw, 68px); font-weight: 400; line-height: .98; }
      h1 em { color: #a83245; }
      p:last-child { max-width: 360px; color: #71696a; font: 15px/1.7 Arial, sans-serif; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/"> <span>Field</span>notes.</a>
      <p class="label">A little pause</p>
      <h1>The page is <em>out of reach.</em></h1>
      <p>Reconnect to return to the library. Your saved notes and account stay on this device.</p>
    </main>
  </body>
</html>
