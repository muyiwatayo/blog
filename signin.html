<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio · Fieldnotes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <main class="studio-shell">
    <header>
      <h1 id="welcomeUser">Loading your studio...</h1>
      <button id="signOutBtn" type="button">Sign Out</button>
    </header>
  </main>

  <script>
    const supabaseUrl = window.ENV?.SUPABASE_URL;
    const supabaseAnonKey = window.ENV?.SUPABASE_ANON_KEY;
    const supabase = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

    async function initStudioSession() {
      // Parse active session or OAuth token from URL
      const { data: { session }, error } = await supabase.auth.getSession();

      if (error || !session) {
        // No valid session -> return to sign in
        window.location.href = 'signin.html';
        return;
      }

      // Display authenticated user details
      const user = session.user;
      const userName = user.user_metadata?.full_name || user.email;
      document.getElementById('welcomeUser').textContent = `Welcome back, ${userName}`;
    }

    // Auth state listener catches the OAuth redirect session immediately
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'SIGNED_IN' && session) {
        initStudioSession();
      } else if (event === 'SIGNED_OUT') {
        window.location.href = 'signin.html';
      }
    });

    initStudioSession();

    // Sign out logic
    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = 'signin.html';
    });
  </script>
</body>
</html>
