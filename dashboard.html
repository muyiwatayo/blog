<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1f2925">
  <link rel="icon" href="icon.svg">
  <title>Writer Studio · Fieldnotes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Loading state shown while session is checked -->
  <div id="dashboardLoading" class="auth-page">
    <main class="auth-page-shell">
      <a class="wordmark" href="index.html"><span>Field</span>notes<span class="wordmark-dot">.</span></a>
      <p style="margin-top: 2rem; color: #6e756f;">Loading your studio…</p>
    </main>
  </div>

  <!-- Main dashboard content (hidden until session confirmed) -->
  <div id="dashboardContent" hidden>
    <div id="noticeRoot"></div>

    <header class="site-header">
      <a class="wordmark" href="index.html"><span>Field</span>notes<span class="wordmark-dot">.</span></a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
      </nav>
      <div class="header-actions">
        <button class="account-trigger" id="logoutButton" type="button">Sign out</button>
      </div>
    </header>

    <main class="dashboard-page">
      <!-- dashboard.js renders into this element -->
      <div class="app-shell" id="dashboardInner"></div>
    </main>
  </div>

  <!-- Modal root for composer and profile editor -->
  <div id="dashboardModalRoot"></div>

  <script src="dashboard.js"></script>
</body>
</html>
